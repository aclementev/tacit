site_name: tacit
site_description: Pydantic-style schemas for data pipelines, built on ibis.
site_url: https://alvaroclemente.github.io/tacit/
repo_url: https://github.com/alvaroclemente/tacit
repo_name: alvaroclemente/tacit
watch:
  - docs/
  - src/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Why tacit: why.md
  - Getting Started: getting-started.md
  - Concepts:
      - Schemas: concepts/schemas.md
      - DataFrames: concepts/dataframes.md
      - Contracts: concepts/contracts.md
      - Constraints: concepts/constraints.md
  - API Reference: api.md
  - Examples:
      - Iris Pipeline: examples/iris-pipeline.md
      - TPC-H Q1: examples/tpch-q1.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
          - why.md
        Guides:
          - getting-started.md
        Concepts:
          - concepts/*.md
        API Reference:
          - api.md
        Examples:
          - examples/*.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - md_in_html
