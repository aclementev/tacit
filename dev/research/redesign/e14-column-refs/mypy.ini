[mypy]
python_version = 3.13
# ibis ships no py.typed; without this mypy treats all of ibis as Any (E1).
follow_untyped_imports = True
check_untyped_defs = True
mypy_path = $MYPY_CONFIG_FILE_DIR/src
cache_dir = $MYPY_CONFIG_FILE_DIR/.mypy_cache

[mypy-tacit_thin.*]
# Simulates an installed package (mypy never reports errors inside site-packages).
# The facade's deliberate Liskov narrowing vs ir.Value is library-internal.
ignore_errors = True

[mypy-tacit_r.*]
ignore_errors = True

[mypy-tacit_rn.*]
ignore_errors = True
