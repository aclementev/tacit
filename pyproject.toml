[project]
name = "tacit"
version = "0.1.0"
description = "A library for explicit data pipelines"
readme = "README.md"
authors = [
    { name = "Alvaro Clemente", email = "clemente.varo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ibis-framework>=9.0.0",
    "pandera[ibis]>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ibis-framework[duckdb]>=9.0.0",
    "ipython>=9.7.0",
    "pyright>=1.1.400",
    "pytest>=8.4.2",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # ibis 12.0.0 uses deprecated duckdb API; pending upstream fix
    "ignore:fetch_arrow_table\\(\\) is deprecated:DeprecationWarning:ibis.backends.duckdb",
]

[tool.ruff]
extend-exclude = ["docs"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
# pandera.ibis has no __all__; pyright treats its public API as private
reportPrivateImportUsage = false
