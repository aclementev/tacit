[project]
name = "tacit"
version = "0.1.0"
description = "A library for explicit data pipelines"
readme = "README.md"
authors = [
    { name = "Alvaro Clemente", email = "clemente.varo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ibis-framework[duckdb]>=9.0.0",
    "pandera[ibis]>=0.27.0",
]

[project.scripts]
tacit = "tacit:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.7.0",
    "pyright>=1.1.400",
    "pytest>=8.4.2",
]
